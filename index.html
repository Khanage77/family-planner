<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5B3DF5">
<meta name="description" content="Khan Family Planner — the family week, shared between both phones. Works offline.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="supabase.js"></script>
<script src="sync.js"></script>
<title>Khan Family Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=Azeret+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#ECEEF5; --surface:#FFFFFF; --surface-2:#F5F6FB; --line:#E1E4F0; --line-2:#EDEFF7;
  --ink:#13121C; --ink-2:#4C4A5E; --ink-3:#8A88A0;
  --board:#171528; --board-ink:#FFFFFF; --board-dim:rgba(255,255,255,.62); --board-soft:rgba(255,255,255,.10); --board-line:rgba(255,255,255,.16);
  --accent:#5B3DF5; --accent-ink:#FFFFFF;
  --hot:#FF3D71; --hot-ink:#FFFFFF;
  --warn-bg:#FFF3D6; --warn-line:#E8A93B; --warn-ink:#6B4600;
  --shadow-s:0 1px 2px rgba(19,18,28,.06);
  --shadow-m:0 2px 6px rgba(19,18,28,.06),0 10px 24px rgba(19,18,28,.07);
  --shadow-board:0 10px 26px rgba(23,21,40,.22);
  --scrim:rgba(14,13,24,.5);
  --dotlift:1;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:"Azeret Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --railx:73px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0B13; --surface:#181724; --surface-2:#201E2E; --line:#2D2B3E; --line-2:#242232;
    --ink:#F2F1F8; --ink-2:#B3B0C6; --ink-3:#7A7790;
    --board:#1C1A2E; --board-ink:#FFFFFF; --board-dim:rgba(255,255,255,.6); --board-soft:rgba(255,255,255,.08); --board-line:rgba(255,255,255,.13);
    --accent:#8C74FF; --accent-ink:#120E27;
    --hot:#FF6188; --hot-ink:#1B0710;
    --warn-bg:#3A2C10; --warn-line:#B78A2E; --warn-ink:#F6DCA6;
    --shadow-s:0 1px 2px rgba(0,0,0,.4);
    --shadow-m:0 2px 6px rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.35);
    --shadow-board:0 10px 26px rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.62);
    --dotlift:1.22;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0B13; --surface:#181724; --surface-2:#201E2E; --line:#2D2B3E; --line-2:#242232;
  --ink:#F2F1F8; --ink-2:#B3B0C6; --ink-3:#7A7790;
  --board:#1C1A2E; --board-ink:#FFFFFF; --board-dim:rgba(255,255,255,.6); --board-soft:rgba(255,255,255,.08); --board-line:rgba(255,255,255,.13);
  --accent:#8C74FF; --accent-ink:#120E27;
  --hot:#FF6188; --hot-ink:#1B0710;
  --warn-bg:#3A2C10; --warn-line:#B78A2E; --warn-ink:#F6DCA6;
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow-m:0 2px 6px rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.35);
  --shadow-board:0 10px 26px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.62);
  --dotlift:1.22;
}

html,body{height:100%}
body{background:var(--board);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{max-width:620px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}

/* ---- board ---- */
.board{background:var(--board);color:var(--board-ink);padding:14px 16px 12px;position:relative;overflow:hidden}
.board::after{content:"";position:absolute;right:-70px;top:-90px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 55%,transparent) 0%,transparent 68%);pointer-events:none}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.brand .eyebrow{display:block;font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--board-dim);margin-bottom:1px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--board-dim);background:var(--board-soft);border:1px solid var(--board-line);padding:5px 10px;border-radius:999px;white-space:nowrap}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.status.live .dot{background:#3DDC97;box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:ping 2.6s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}70%{box-shadow:0 0 0 7px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}

.nextup{position:relative;margin-top:12px;background:var(--board-soft);border:1px solid var(--board-line);border-radius:16px;padding:11px 13px;display:flex;align-items:center;gap:11px;min-height:58px}
.nextup .pulse{width:10px;height:10px;border-radius:50%;background:var(--hot);flex-shrink:0;animation:beat 2.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.45);opacity:.72}}
.nextup .nt{min-width:0;flex:1}
.nextup .lbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--board-dim)}
.nextup .val{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nextup .cd{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--board-ink);background:var(--hot);color:var(--hot-ink);padding:5px 9px;border-radius:9px;white-space:nowrap;flex-shrink:0}
.nextup .cd.calm{background:var(--board-soft);color:var(--board-dim);border:1px solid var(--board-line)}

.chips{display:flex;gap:6px;overflow-x:auto;padding:11px 0 1px;scrollbar-width:none;position:relative}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--board-line);background:var(--board-soft);color:var(--board-dim);border-radius:999px;padding:5px 11px 5px 5px;font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:transform .12s ease}
.chip.plain{padding:6px 12px}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--board-ink);color:var(--board);border-color:transparent}
.chip.kid.on{background:var(--c);color:#fff}

/* ---- sticky day strip ---- */
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:22;background:var(--board);border-radius:0 0 22px 22px;box-shadow:var(--shadow-board);padding:6px 8px 9px;display:flex;align-items:center;gap:2px}
.navbar .arrow{width:26px;height:44px;border:0;background:none;color:var(--board-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:10px}
.navbar .arrow:active{background:var(--board-soft)}
.navbar .arrow svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;flex:1;min-width:0}
.pill{border:0;background:none;color:var(--board-dim);padding:4px 0 5px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .15s ease}
.pill .dw{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.pill .dn{font-family:var(--f-mono);font-weight:600;font-size:14px;color:var(--board-ink);width:25px;height:25px;display:flex;align-items:center;justify-content:center;border-radius:50%;line-height:1}
.pill.today .dn{background:var(--hot);color:var(--hot-ink)}
.pill.weekend .dw{color:color-mix(in srgb,var(--hot) 70%,var(--board-dim))}
.pill:active{background:var(--board-soft)}
.pill .dots{display:flex;gap:2.5px;height:5px;align-items:center}
.pill .dots i{width:4.5px;height:4.5px;border-radius:50%;background:var(--c);display:block;filter:brightness(var(--dotlift))}
.pill .dots b{font-size:8px;font-weight:700;color:var(--board-dim);line-height:1}

main{flex:1;padding:14px 16px calc(100px + env(safe-area-inset-bottom,0px))}
.view[hidden]{display:none}

.notice{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:14px;padding:10px 13px;font-size:13px;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start}
.notice svg{width:16px;height:16px;flex-shrink:0;margin-top:2px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- week progress ---- */
.tally{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:0 2px}
.tally .nums{font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap}
.tally .nums b{color:var(--ink);font-size:17px}
.tally .track{flex:1;height:7px;border-radius:999px;background:var(--line);overflow:hidden}
.tally .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 40%,var(--hot)));transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* ---- day cards ---- */
.day{margin-bottom:18px;scroll-margin-top:calc(72px + env(safe-area-inset-top,0px));animation:rise .34s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*35ms)}
@keyframes rise{from{opacity:.35;transform:translateY(7px)}to{opacity:1;transform:none}}
.dayhead{display:flex;align-items:center;gap:9px;margin-bottom:7px;padding-left:2px}
.dayhead .dn{font-family:var(--f-mono);font-weight:600;font-size:19px;color:var(--ink);line-height:1;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:11px;background:var(--surface);border:1px solid var(--line);flex-shrink:0}
.dayhead.today .dn{background:var(--hot);color:var(--hot-ink);border-color:transparent}
.dayhead .nm{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:-.01em;flex:1;min-width:0}
.dayhead .nm small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.dayhead.today .nm{color:var(--hot)}
.dayhead .add{width:30px;height:30px;border-radius:10px;border:1px dashed var(--line);background:none;color:var(--ink-3);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s ease}
.dayhead .add svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.dayhead .add:active{transform:scale(.9);color:var(--accent);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-s);overflow:hidden}
.day.today .card{box-shadow:var(--shadow-m)}
.list{position:relative}
.list.rail::before{content:"";position:absolute;left:var(--railx);top:26px;bottom:26px;width:2px;background:var(--line);border-radius:2px}
.empty{padding:14px;font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.empty .z{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);opacity:.7}

.ev{display:grid;grid-template-columns:56px 20px 1fr 36px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-2);padding:11px 8px 11px 8px;position:relative;transition:background .15s ease}
.ev:last-child{border-bottom:0}
.ev:active{background:var(--surface-2)}
.ev .time{font-family:var(--f-mono);font-weight:600;font-size:12.5px;color:var(--ink);text-align:right;padding-right:9px;padding-top:2px;line-height:1.25;white-space:nowrap}
.ev .time small{display:block;font-weight:500;font-size:10.5px;color:var(--ink-3)}
.ev .time.allday{font-family:var(--f-body);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ev .rl{display:flex;justify-content:center;padding-top:5px}
.ev .rl i{width:11px;height:11px;border-radius:50%;background:var(--kc);box-shadow:0 0 0 3px var(--surface);display:block;filter:brightness(var(--dotlift))}
.ev.done .rl i{background:var(--surface);box-shadow:0 0 0 2px var(--line),0 0 0 5px var(--surface)}
.ev .bd{min-width:0;padding-right:4px}
.ev .ttl{display:flex;align-items:flex-start;gap:7px;font-weight:600;font-size:14.5px;line-height:1.3;letter-spacing:-.005em;overflow-wrap:anywhere}
.ev .ttl svg{width:15px;height:15px;flex-shrink:0;margin-top:1px;stroke:var(--cc);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:brightness(var(--dotlift))}
.ev.done .ttl{color:var(--ink-3)}
.ev.done .ttl span{text-decoration:line-through}
.ev .mt{display:flex;flex-wrap:wrap;align-items:center;gap:5px 7px;margin-top:5px;font-size:11.5px;color:var(--ink-2)}
.ev .mt .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-3);opacity:.5}
.stack{display:flex;align-items:center}
.stack .av{width:19px;height:19px;border-radius:50%;background:var(--c);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--surface);margin-left:-6px;filter:brightness(var(--dotlift));font-family:var(--f-body)}
.stack .av:first-child{margin-left:0}
.badge{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1.5px 6px;border-radius:6px;background:color-mix(in srgb,var(--cc) 15%,transparent);color:var(--cc);filter:brightness(var(--dotlift))}
.rep{display:inline-flex;align-items:center;gap:3px;color:var(--ink-3);font-size:11px}
.rep svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.check{width:27px;height:27px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;margin-top:1px;transition:all .18s cubic-bezier(.2,.8,.2,1)}
.check svg{width:14px;height:14px;stroke:var(--accent-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transition:all .18s cubic-bezier(.2,.8,.2,1)}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on svg{opacity:1;transform:none}
.check:active{transform:scale(.88)}

.nowrow{display:grid;grid-template-columns:56px 20px 1fr;align-items:center;padding:2px 8px;border:0;pointer-events:none}
.nowrow .nt{font-family:var(--f-mono);font-weight:600;font-size:10.5px;color:var(--hot);text-align:right;padding-right:9px}
.nowrow .nd{display:flex;justify-content:center}
.nowrow .nd i{width:9px;height:9px;border-radius:50%;background:var(--hot);box-shadow:0 0 0 3px var(--surface),0 0 0 5px color-mix(in srgb,var(--hot) 30%,transparent)}
.nowrow .nb{height:2px;border-radius:2px;background:linear-gradient(90deg,var(--hot),transparent)}

/* ---- setup / sections ---- */
.setup{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow-s)}
.setup h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0 0 5px;letter-spacing:-.01em}
.setup p{margin:0 0 12px;color:var(--ink-2);font-size:13.5px}
.section{margin-bottom:22px}
.section h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
.section p.sub{margin:0 0 10px;color:var(--ink-2);font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600;font-size:14px}
.row .av{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;filter:brightness(var(--dotlift))}
.row .del{border:0;background:none;color:var(--ink-3);font-size:12px;font-weight:700;padding:5px 7px;border-radius:8px}
.row .del.arm{color:var(--hot);background:color-mix(in srgb,var(--hot) 12%,transparent)}
.inline{display:flex;gap:8px;padding:11px 13px}
.inline input{flex:1;min-width:0}
.field{margin-bottom:12px}
.field label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.field input[type=text],.field input[type=email],.field input[type=date],.field input[type=time],.field select,.field textarea,.inline input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:11px 13px;font-size:15px}
.field textarea{min-height:66px;resize:vertical;font-family:var(--f-body)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:transform .12s ease}
.opt:active{transform:scale(.95)}
.opt svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.opt .av{width:19px;height:19px;border-radius:50%;background:var(--c);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.opt.on{background:var(--c,var(--accent));color:#fff;border-color:transparent}
.opt.on .av{background:rgba(255,255,255,.28)}
.tog{display:flex;align-items:flex-start;gap:10px;padding:8px 0;font-size:13.5px;color:var(--ink-2);line-height:1.35}
.tog input{width:19px;height:19px;accent-color:var(--accent);flex-shrink:0;margin-top:1px}
.btn{width:100%;border:0;border-radius:13px;padding:14px;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink);transition:transform .12s ease}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:none;border:0;color:var(--hot);padding:10px}
.btn[disabled]{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow .btn{flex:1}
a.btn{display:block;text-align:center;text-decoration:none}
.help ol{margin:8px 0 0 18px;padding:0;font-size:13px;color:var(--ink-2);line-height:1.6}

/* ---- chrome ---- */
.fab{position:fixed;right:max(16px,calc(50% - 310px + 16px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:19px;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent);display:flex;align-items:center;justify-content:center;z-index:25;transition:transform .16s cubic-bezier(.2,.8,.2,1)}
.fab:active{transform:scale(.9) rotate(45deg)}
.fab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:24}
.tabs .inner{display:flex;width:100%;max-width:620px}
.tab{flex:1;border:0;background:none;color:var(--ink-3);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;transition:color .15s ease}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.tab.on{color:var(--accent)}
.tab.on svg{transform:translateY(-1px) scale(1.08)}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:8px 16px calc(22px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:0 auto 10px}
.sheet header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet header h3{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;letter-spacing:-.015em}
.iconbtn{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.textbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:0 14px;height:44px;font-weight:700;font-size:13px;flex-shrink:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;box-shadow:var(--shadow-m);max-width:calc(100% - 32px);text-align:center;animation:up .22s cubic-bezier(.2,.9,.25,1)}
.agendaday{margin-bottom:15px}
.agendaday .dh{font-family:var(--f-display);font-weight:600;font-size:15px;margin:0 0 6px 2px;display:flex;align-items:baseline;gap:8px}
.agendaday .dh small{font-family:var(--f-body);font-weight:500;color:var(--ink-3);font-size:11.5px}
.agendaday .dh .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
/* ---- app shell additions ---- */
[hidden]{display:none!important}
img{max-width:100%}
.field input[type=password]{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 13px;font:inherit;color:var(--ink)}
.login{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.login .box{width:100%;max-width:380px}
.login .eyebrow{display:block;margin-bottom:4px}
.login h1{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.02em;margin:0 0 6px}
.login p{color:var(--ink-2);font-size:14px;margin:0 0 18px}
.login .err{color:var(--hot);font-size:13px;font-weight:600;min-height:18px;margin:4px 0 8px}
.login .fine{font-size:12px;color:var(--ink-3);margin-top:14px}
.whoami{display:flex;align-items:center;gap:10px;padding:12px 14px}
.whoami .grow{font-weight:600;word-break:break-all}
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <form class="box" id="loginForm" autocomplete="on">
    <span class="eyebrow">Khan Family</span>
    <h1>Family Planner</h1>
    <p>Sign in once on this phone and it stays signed in.</p>
    <div class="field"><label for="lgEmail">Email</label><input id="lgEmail" type="email" autocomplete="username" inputmode="email" required></div>
    <div class="field"><label for="lgPass">Password</label><input id="lgPass" type="password" autocomplete="current-password" required></div>
    <div class="err" id="lgErr" role="alert"></div>
    <button class="btn" id="lgBtn" type="submit">Sign in</button>
    <div class="fine">Forgot your password? Ask Ridwaan to reset it.</div>
  </form>
</div>

<div class="app">
  <div class="board">
    <div class="brand">
      <div><span class="eyebrow">Khan Family</span><h1>The Week Ahead</h1></div>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">Connecting</span></div>
    </div>
    <div class="nextup" id="nextup"></div>
    <div class="chips" id="kidFilter"></div>
  </div>

  <div class="navbar" id="navbar">
    <button class="arrow" id="prevWeek" aria-label="Previous week"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="strip" id="strip"></div>
    <button class="arrow" id="nextWeek" aria-label="Next week"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>

  <main>
    <div id="writeNotice" class="notice" hidden>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <div>This account can view the planner but not change it. Ask Ridwaan to check the access list.</div>
    </div>
    <section class="view" id="view-week"></section>
    <section class="view" id="view-agenda" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>

  <button class="fab" id="fab" aria-label="Add an item"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

  <nav class="tabs"><div class="inner">
    <button class="tab on" data-view="week"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 10h18M8 2.5v4M16 2.5v4"/></svg>Week</button>
    <button class="tab" data-view="agenda"><svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.4"/><circle cx="4" cy="12" r="1.4"/><circle cx="4" cy="18" r="1.4"/></svg>Coming up</button>
    <button class="tab" data-view="settings"><svg viewBox="0 0 24 24"><path d="M8.5 11.5a3 3 0 100-6 3 3 0 000 6zM2.5 20v-1.2a4.5 4.5 0 014.5-4.5h3a4.5 4.5 0 014.5 4.5V20"/><path d="M16.5 6.2a3 3 0 010 5.6M21.5 20v-1.2a4.5 4.5 0 00-3.2-4.3"/></svg>Family</button>
  </div></nav>
</div>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
/* ---------- constants ---------- */
const KID_COLORS=["#2D7FF9","#FF5A3D","#17B26A","#A855F7","#F59E0B","#EC4899","#06B6D4","#84CC16"];
const CATS={
  sport:{label:"Sport",c:"#FF5A3D",d:"M12 2.2a9.8 9.8 0 100 19.6 9.8 9.8 0 000-19.6M12 2.2c3.4 3 3.4 16.6 0 19.6M12 2.2c-3.4 3-3.4 16.6 0 19.6M2.3 12h19.4"},
  tuition:{label:"Tuition",c:"#2D7FF9",d:"M12 7.2S9.8 5.2 6 5.2v13c3.8 0 6 2 6 2s2.2-2 6-2v-13c-3.8 0-6 2-6 2zM12 7.2v13"},
  school:{label:"School",c:"#7C5CFF",d:"M2.4 9L12 4.6 21.6 9 12 13.4 2.4 9zM6.4 11v4.4c0 1.3 2.5 2.4 5.6 2.4s5.6-1.1 5.6-2.4V11"},
  exam:{label:"Exam",c:"#E11D48",d:"M9 3.2h6v3H9zM15 4.7h3.6v16.1H5.4V4.7H9M8.6 13.2l2.2 2.2 4.6-4.6"},
  project:{label:"Project",c:"#F59E0B",d:"M9.6 18.2h4.8M10.6 21h2.8M12 3a6.4 6.4 0 00-3.7 11.6v3.6h7.4v-3.6A6.4 6.4 0 0012 3z"},
  appointment:{label:"Appointment",c:"#0EA5B7",d:"M2.6 12h3.7l2.5 7 4-14.4 2.6 7.4h5"},
  playdate:{label:"Play date",c:"#EC4899",d:"M8.6 11.2a3 3 0 100-6 3 3 0 000 6zM2.6 20.6V19a4.1 4.1 0 014.1-4.1h3.8A4.1 4.1 0 0114.6 19v1.6M16.6 5.8a3 3 0 010 5.8M21.4 20.6V19a4.1 4.1 0 00-3.1-4"},
  madrasah:{label:"Madrasah",c:"#17B26A",d:"M20.6 14.9A8.3 8.3 0 019.3 3.6a8.7 8.7 0 1011.3 11.3z"},
  other:{label:"Other",c:"#8A889B",d:"M12 21.6s7-6.5 7-11.4A7 7 0 005 10.2c0 4.9 7 11.4 7 11.4zM12 12.4a2.2 2.2 0 100-4.4 2.2 2.2 0 000 4.4z"},
};
const WHO={dad:"Dad",mum:"Mum",both:"Both"};
const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const DAY_L=["M","T","W","T","F","S","S"];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const REPEAT_ICON='<svg viewBox="0 0 24 24"><path d="M17 2.5l3.5 3.5L17 9.5M20.5 6H7a3.5 3.5 0 00-3.5 3.5M7 21.5L3.5 18 7 14.5M3.5 18H17a3.5 3.5 0 003.5-3.5"/></svg>';

/* ---------- state ---------- */
const S={kids:[],events:[],settings:null,weekOffset:0,filter:"all",view:"week",db:null,downloads:null,canWrite:true};
let armedDelete=null,lastMinute="";

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function parse(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function monday(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x;}
const dow=s=>(parse(s).getDay()+6)%7;
const today=()=>ymd(new Date());
const fmtShort=d=>`${d.getDate()} ${MONTHS[d.getMonth()]}`;
const fmtLong=d=>`${DAYS[(d.getDay()+6)%7]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
function addMinutes(t,n){const[h,m]=t.split(":").map(Number);const x=new Date(2000,0,1,h,m+n);return`${pad(x.getHours())}:${pad(x.getMinutes())}`;}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initial=n=>(n||"?").trim().charAt(0).toUpperCase();

function occursOn(ev,ds){
  if(!ev.date)return false;
  if(ev.repeat==="weekly"){
    if(ds<ev.date)return false;
    if(ev.until&&ds>ev.until)return false;
    return dow(ds)===dow(ev.date);
  }
  return ev.date===ds;
}
const isDone=(ev,ds)=>ev.repeat==="weekly"?!!(ev.doneDates&&ev.doneDates[ds]):!!ev.done;
function eventsOn(ds,filter){
  return S.events.filter(e=>occursOn(e,ds))
    .filter(e=>filter==="all"||(e.kidIds||[]).includes(filter))
    .sort((a,b)=>{const x=a.time||"99:99",y=b.time||"99:99";return x<y?-1:x>y?1:(a.title||"").localeCompare(b.title||"");});
}
const kidById=id=>S.kids.find(k=>k.id===id);
function parentName(w){const p=(S.settings&&S.settings.parents)||{};return w==="both"?`${p.dad||"Dad"} & ${p.mum||"Mum"}`:(p[w]||WHO[w]||"");}
const weekStart=()=>addDays(monday(new Date()),S.weekOffset*7);

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  const r=document.getElementById("toastRoot");
  r.innerHTML=`<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toastT);toastT=setTimeout(()=>r.innerHTML="",2600);
}

/* ---------- db ---------- */
function setStatus(live,text){
  document.getElementById("status").classList.toggle("live",live);
  document.getElementById("statusText").textContent=text;
}
const ALLOWED=["ridwaankhan77@gmail.com","shamillaskhan@gmail.com"];
S.user=null;
S.downloads={save:async({filename,data})=>{const u=URL.createObjectURL(data);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}};
function connect(){
  const db=KFP.db;S.db=db;
  KFP.onStatus(st=>{
    if(st.online&&!st.pending)setStatus(true,"Live");
    else if(st.online)setStatus(true,"Syncing…");
    else setStatus(false,st.pending?`Offline · ${st.pending} to sync`:"Offline");
  });
  db.collection("kids").orderBy("order").onSnapshot(s=>{S.kids=s.docs.map(d=>({id:d.id,...d.data()}));render();});
  db.collection("events").onSnapshot(s=>{S.events=s.docs.map(d=>({id:d.id,...d.data()}));render();});
  db.doc("settings/main").onSnapshot(s=>{S.settings=s.exists?s.data():{emails:[],parents:{dad:"Dad",mum:"Mum"}};render();});
  KFP.start();
}
async function write(fn){
  if(!S.db){toast("Still signing in…");return false;}
  try{await fn();return true;}
  catch(e){
    if(e&&e.code==="invalid_argument"&&S.canWrite){S.canWrite=false;document.getElementById("writeNotice").hidden=false;document.getElementById("fab").hidden=true;}
    toast(e&&e.code==="quota_exceeded"?"Storage is full — delete some old items":"Couldn’t save that — try again");
    return false;
  }
}

/* ---------- pieces ---------- */
const avatarsHtml=kids=>`<span class="stack">${kids.map(k=>`<span class="av" style="--c:${k.color}">${initial(k.name)}</span>`).join("")}</span>`;
const catIcon=cat=>`<svg viewBox="0 0 24 24"><path d="${cat.d}"/></svg>`;

function eventRow(ev,ds){
  const kids=(ev.kidIds||[]).map(kidById).filter(Boolean);
  const cat=CATS[ev.category]||CATS.other;
  const done=isDone(ev,ds);
  const kc=kids[0]?kids[0].color:"var(--ink-3)";
  const time=ev.time?`${ev.time}${ev.endTime?`<small>${ev.endTime}</small>`:""}`:"all day";
  const mt=[];
  if(kids.length)mt.push(`${avatarsHtml(kids)}<span>${esc(kids.map(k=>k.name).join(", "))}</span>`);
  mt.push(`<span class="badge" style="--cc:${cat.c}">${cat.label}</span>`);
  if(ev.who&&WHO[ev.who])mt.push(`<span>${esc(parentName(ev.who))}</span>`);
  if(ev.location)mt.push(`<span>${esc(ev.location)}</span>`);
  if(ev.repeat==="weekly")mt.push(`<span class="rep">${REPEAT_ICON}weekly</span>`);
  return `<div class="ev ${done?"done":""}" style="--kc:${kc};--cc:${cat.c}" data-ev="${ev.id}" data-date="${ds}" role="button" tabindex="0">
    <div class="time ${ev.time?"":"allday"}">${time}</div>
    <div class="rl"><i></i></div>
    <div class="bd"><div class="ttl">${catIcon(cat)}<span>${esc(ev.title)}</span></div><div class="mt">${mt.join("")}</div></div>
    <button class="check ${done?"on":""}" data-check="${ev.id}" data-date="${ds}" aria-label="${done?"Mark not done":"Mark done"}"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  </div>`;
}

/* ---------- next up ---------- */
function nextUp(){
  const now=new Date();
  for(let i=0;i<14;i++){
    const d=addDays(now,i),ds=ymd(d);
    for(const e of eventsOn(ds,S.filter)){
      if(isDone(e,ds))continue;
      if(e.time){
        const[h,m]=e.time.split(":").map(Number);
        const at=parse(ds);at.setHours(h,m,0,0);
        if(at>now)return{ev:e,ds,at,timed:true};
      }else if(i>0||true){
        const at=parse(ds);at.setHours(23,59,0,0);
        if(at>now)return{ev:e,ds,at,timed:false};
      }
    }
  }
  return null;
}
function countdown(at){
  const ms=at-new Date(),mins=Math.round(ms/60000);
  if(mins<1)return"now";
  if(mins<60)return`${mins}m`;
  if(mins<24*60)return`${Math.floor(mins/60)}h ${mins%60}m`;
  const d=Math.round(mins/1440);
  return d===1?"tomorrow":`${d} days`;
}
function renderNextUp(){
  const el=document.getElementById("nextup");
  const n=nextUp();
  if(!n){
    el.innerHTML=`<div class="nt"><div class="lbl">Nothing scheduled</div><div class="val">Clear diary ahead</div></div>`;
    return;
  }
  const kids=(n.ev.kidIds||[]).map(kidById).filter(Boolean);
  const when=n.ds===today()?"Next up today":n.ds===ymd(addDays(new Date(),1))?"Next up tomorrow":`Next up ${fmtLong(parse(n.ds))}`;
  el.innerHTML=`<span class="pulse"></span>
    <div class="nt"><div class="lbl">${esc(when)}</div><div class="val">${esc(n.ev.title)}${kids.length?` · ${esc(kids.map(k=>k.name).join(", "))}`:""}</div></div>
    <span class="cd ${n.timed?"":"calm"}">${n.timed?esc(countdown(n.at)):"all day"}</span>`;
}

/* ---------- render ---------- */
function render(){
  if(S.filter!=="all"&&S.kids.length&&!kidById(S.filter))S.filter="all";
  renderNextUp();renderChips();renderStrip();
  if(S.view==="week")renderWeek();
  if(S.view==="agenda")renderAgenda();
  if(S.view==="settings")renderSettings();
  document.getElementById("navbar").hidden=S.view!=="week";
}
function renderChips(){
  document.getElementById("kidFilter").innerHTML=
    `<button class="chip plain ${S.filter==="all"?"on":""}" data-kid="all">Everyone</button>`+
    S.kids.map(k=>`<button class="chip kid ${S.filter===k.id?"on":""}" data-kid="${k.id}" style="--c:${k.color}"><span class="av" style="width:20px;height:20px;border-radius:50%;background:${S.filter===k.id?"rgba(255,255,255,.3)":k.color};color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">${initial(k.name)}</span>${esc(k.name)}</button>`).join("");
}
function renderStrip(){
  const m=weekStart(),td=today();
  let h="";
  for(let i=0;i<7;i++){
    const d=addDays(m,i),ds=ymd(d),evs=eventsOn(ds,S.filter);
    const cols=[...new Set(evs.map(e=>(e.kidIds||[])[0]).map(id=>kidById(id)?.color).filter(Boolean))];
    const dots=cols.slice(0,3).map(c=>`<i style="--c:${c}"></i>`).join("")+(cols.length>3?`<b>+</b>`:"");
    h+=`<button class="pill ${ds===td?"today":""} ${i>4?"weekend":""}" data-goto="${ds}" aria-label="${fmtLong(d)}, ${evs.length} items">
      <span class="dw">${DAY_L[i]}</span><span class="dn">${d.getDate()}</span><span class="dots">${dots}</span></button>`;
  }
  document.getElementById("strip").innerHTML=h;
}
function renderWeek(){
  const el=document.getElementById("view-week"),m=weekStart(),td=today();
  let h="";
  if(!S.kids.length){
    h+=`<div class="setup"><h2>Start with your children</h2><p>Add each child once. Everything you schedule is then tagged to them and colour-coded across the week.</p><div class="inline" style="padding:0"><input id="setupKid" type="text" placeholder="Child’s name" autocomplete="off"><button class="textbtn" id="setupAdd">Add</button></div></div>`;
  }
  let total=0,done=0;
  const dayHtml=[];
  for(let i=0;i<7;i++){
    const d=addDays(m,i),ds=ymd(d),isT=ds===td,evs=eventsOn(ds,S.filter);
    total+=evs.length;done+=evs.filter(e=>isDone(e,ds)).length;
    let rows=evs.map(e=>eventRow(e,ds));
    if(isT&&evs.length){
      const now=new Date(),nt=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
      let idx=evs.findIndex(e=>(e.time||"99:99")>nt);
      if(idx<0)idx=evs.length;
      rows.splice(idx,0,`<div class="nowrow"><div class="nt">${nt}</div><div class="nd"><i></i></div><div class="nb"></div></div>`);
    }
    dayHtml.push(`<div class="day ${isT?"today":""}" id="day-${ds}" style="--i:${i}">
      <div class="dayhead ${isT?"today":""}">
        <span class="dn">${d.getDate()}</span>
        <span class="nm">${DAYS[i]}<small>${isT?"Today":evs.length?evs.length+(evs.length===1?" item":" items"):"Free"}</small></span>
        <button class="add" data-add="${ds}" aria-label="Add to ${DAYS[i]}"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="card"><div class="list ${evs.length?"rail":""}">${evs.length?rows.join(""):`<div class="empty"><span class="z">— — —</span> Nothing planned</div>`}</div></div>
    </div>`);
  }
  if(total){
    const pct=Math.round(done/total*100);
    h+=`<div class="tally"><span class="nums"><b>${done}</b> of ${total} done</span><span class="track"><span class="fill" style="width:${pct}%"></span></span></div>`;
  }
  el.innerHTML=h+dayHtml.join("");
}
function renderAgenda(){
  const el=document.getElementById("view-agenda"),start=new Date();start.setHours(0,0,0,0);
  let h=`<div class="section" style="margin-bottom:14px"><h2>Next 30 days</h2><p class="sub">Everything still outstanding${S.filter!=="all"?` for ${esc(kidById(S.filter)?.name||"")}`:""}. Tap any item to change it.</p></div>`;
  let any=false;
  for(let i=0;i<30;i++){
    const d=addDays(start,i),ds=ymd(d),evs=eventsOn(ds,S.filter).filter(e=>!isDone(e,ds));
    if(!evs.length)continue;
    any=true;
    h+=`<div class="agendaday"><div class="dh"><span>${i===0?"Today":i===1?"Tomorrow":DAYS[(d.getDay()+6)%7]}</span><small>${fmtShort(d)}</small><span class="cnt">${evs.length}</span></div>
      <div class="card"><div class="list rail">${evs.map(e=>eventRow(e,ds)).join("")}</div></div></div>`;
  }
  if(!any)h+=`<div class="card"><div class="empty"><span class="z">— — —</span> Nothing outstanding in the next 30 days.</div></div>`;
  el.innerHTML=h;
}
function renderSettings(){
  const st=S.settings||{emails:[],parents:{}},p=st.parents||{},emails=st.emails||[];
  document.getElementById("view-settings").innerHTML=`
  <div class="section"><h2>Children</h2><p class="sub">Each child carries a colour through the whole planner.</p>
    <div class="card">${S.kids.map(k=>`<div class="row"><span class="av" style="--c:${k.color}">${initial(k.name)}</span><span class="grow">${esc(k.name)}</span><button class="del ${armedDelete==="kid:"+k.id?"arm":""}" data-delkid="${k.id}">${armedDelete==="kid:"+k.id?"Tap again":"Delete"}</button></div>`).join("")}
      <div class="inline"><input id="newKid" type="text" placeholder="Add a child" autocomplete="off"><button class="textbtn" id="addKid">Add</button></div></div></div>

  <div class="section"><h2>Parents</h2><p class="sub">Names used when an item is assigned to one of you.</p>
    <div class="two"><div class="field"><label for="pDad">Dad</label><input id="pDad" type="text" value="${esc(p.dad||"Dad")}"></div><div class="field"><label for="pMum">Mum</label><input id="pMum" type="text" value="${esc(p.mum||"Mum")}"></div></div></div>

  <div class="section"><h2>Monday morning email</h2><p class="sub">Every Monday at 07:00 a PDF of the week ahead goes to these addresses (sent by Ridwaan’s Claude scheduled task).</p>
    <div class="card">${emails.map((e,i)=>`<div class="row"><span class="grow" style="font-weight:500">${esc(e)}</span><button class="del" data-delemail="${i}">Remove</button></div>`).join("")||`<div class="empty">No addresses yet</div>`}
      <div class="inline"><input id="newEmail" type="email" placeholder="name@example.com" autocomplete="off"><button class="textbtn" id="addEmail">Add</button></div></div></div>

  <div class="section"><h2>This week as PDF</h2><p class="sub">The same sheet as the Monday email, for the week you’re looking at.</p>
    <button class="btn ghost" id="pdfBtn" ${S.downloads?"":"disabled"}>${S.downloads?"Download this week’s PDF":"Downloads unavailable here"}</button></div>

  <div class="section help"><h2>On your phone</h2><p class="sub">Install it once and it opens from its own icon, even without signal. Changes made offline sync when you're back online.</p>
    ${S.installEvt?`<button class="btn" id="installBtn">Install on this phone</button>`:`<ol><li>Open the planner link in <b>Chrome</b>.</li><li>Tap ⋮ → <b>Add to Home screen</b> → <b>Install</b>.</li></ol>`}</div>

  <div class="section"><h2>Account</h2><p class="sub">Signed in on this phone.</p>
    <div class="card"><div class="whoami"><span class="grow">${esc(S.user||"")}</span><button class="textbtn" id="signOutBtn">Sign out</button></div></div></div>

  <div class="section"><h2>Reminders</h2><p class="sub">Open any item and tap <b>Add to Google Calendar</b> — Google then alerts both phones, including weekly repeats. While the planner is open, items marked for a reminder also raise an alert an hour before.</p></div>`;
}

/* ---------- sheet ---------- */
function openSheet(ev,ds){
  const isEdit=!!ev;
  const f=ev?{...ev}:{title:"",kidIds:S.filter!=="all"?[S.filter]:(S.kids[0]?[S.kids[0].id]:[]),category:"sport",date:ds||today(),time:"",endTime:"",repeat:"none",until:"",who:"",location:"",notes:"",remind:false};
  const root=document.getElementById("sheetRoot");
  root.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <header><h3 id="sheetTitle">${isEdit?"Edit item":"New item"}</h3><button class="iconbtn" id="closeSheet" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="field"><label for="fTitle">What</label><input id="fTitle" type="text" placeholder="Cricket practice, Maths tuition, Dentist…" value="${esc(f.title)}"></div>
    <div class="field"><label>Who it’s for</label><div class="opts" id="fKids">${S.kids.map(k=>`<button class="opt ${f.kidIds.includes(k.id)?"on":""}" data-kid="${k.id}" style="--c:${k.color}"><span class="av" style="background:${k.color}">${initial(k.name)}</span>${esc(k.name)}</button>`).join("")}</div></div>
    <div class="field"><label>Type</label><div class="opts" id="fCat">${Object.entries(CATS).map(([k,c])=>`<button class="opt ${f.category===k?"on":""}" data-cat="${k}" style="--c:${c.c}">${catIcon(c)}${c.label}</button>`).join("")}</div></div>
    <div class="two"><div class="field"><label for="fDate" id="lblDate">${f.repeat==="weekly"?"First date":"Date"}</label><input id="fDate" type="date" value="${f.date}"></div>
      <div class="field"><label for="fRepeat">Repeats</label><select id="fRepeat"><option value="none" ${f.repeat!=="weekly"?"selected":""}>Once</option><option value="weekly" ${f.repeat==="weekly"?"selected":""}>Every week</option></select></div></div>
    <div class="field" id="untilWrap" ${f.repeat==="weekly"?"":"hidden"}><label for="fUntil">Until (optional)</label><input id="fUntil" type="date" value="${f.until||""}"></div>
    <div class="two"><div class="field"><label for="fTime">Start</label><input id="fTime" type="time" value="${f.time||""}"></div><div class="field"><label for="fEnd">End</label><input id="fEnd" type="time" value="${f.endTime||""}"></div></div>
    <div class="field"><label>Who’s handling it</label><div class="opts" id="fWho">${Object.keys(WHO).map(w=>`<button class="opt ${f.who===w?"on":""}" data-who="${w}">${esc(parentName(w))}</button>`).join("")}</div></div>
    <div class="field"><label for="fLoc">Where</label><input id="fLoc" type="text" placeholder="Venue or address" value="${esc(f.location||"")}"></div>
    <div class="field"><label for="fNotes">Notes</label><textarea id="fNotes" placeholder="Kit to pack, fees due, who’s fetching…">${esc(f.notes||"")}</textarea></div>
    <label class="tog"><input id="fRemind" type="checkbox" ${f.remind?"checked":""}> Alert me an hour before (needs a start time, and the planner open)</label>
    <div class="btnrow"><button class="btn" id="saveBtn">${isEdit?"Save changes":"Add to planner"}</button></div>
    ${isEdit?`<div class="btnrow"><a class="btn ghost" id="gcalBtn" href="${gcalUrl(f)}" target="_blank" rel="noopener">Add to Google Calendar</a></div><div class="btnrow"><button class="btn danger" id="delBtn">Delete this item</button></div>`:""}
  </div></div>`;
  const local={kidIds:[...f.kidIds],category:f.category,who:f.who||""};
  root.querySelector("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet();});
  root.querySelector("#closeSheet").onclick=closeSheet;
  root.querySelector("#fKids").onclick=e=>{const b=e.target.closest("[data-kid]");if(!b)return;const id=b.dataset.kid;local.kidIds=local.kidIds.includes(id)?local.kidIds.filter(x=>x!==id):[...local.kidIds,id];b.classList.toggle("on");};
  root.querySelector("#fCat").onclick=e=>{const b=e.target.closest("[data-cat]");if(!b)return;local.category=b.dataset.cat;root.querySelectorAll("#fCat .opt").forEach(x=>x.classList.toggle("on",x===b));};
  root.querySelector("#fWho").onclick=e=>{const b=e.target.closest("[data-who]");if(!b)return;const w=b.dataset.who;local.who=local.who===w?"":w;root.querySelectorAll("#fWho .opt").forEach(x=>x.classList.toggle("on",x.dataset.who===local.who));};
  root.querySelector("#fRepeat").onchange=e=>{root.querySelector("#untilWrap").hidden=e.target.value!=="weekly";root.querySelector("#lblDate").textContent=e.target.value==="weekly"?"First date":"Date";};
  root.querySelector("#saveBtn").onclick=async()=>{
    const data={title:root.querySelector("#fTitle").value.trim(),kidIds:local.kidIds,category:local.category,
      date:root.querySelector("#fDate").value,repeat:root.querySelector("#fRepeat").value,
      until:root.querySelector("#fRepeat").value==="weekly"?root.querySelector("#fUntil").value:"",
      time:root.querySelector("#fTime").value,endTime:root.querySelector("#fEnd").value,who:local.who,
      location:root.querySelector("#fLoc").value.trim(),notes:root.querySelector("#fNotes").value.trim(),
      remind:root.querySelector("#fRemind").checked};
    if(!data.title){toast("Give it a name first");return;}
    if(!data.date){toast("Pick a date");return;}
    if(!data.kidIds.length){toast("Choose at least one child");return;}
    if(data.endTime&&data.time&&data.endTime<=data.time){toast("End time must be after the start");return;}
    try{if(data.remind&&typeof Notification!=="undefined"&&Notification.permission==="default")Notification.requestPermission().catch(()=>{});}catch(x){}
    const ok=await write(async()=>{
      if(isEdit)await S.db.doc("events/"+ev.id).set({...data,done:ev.done||false,doneDates:ev.doneDates||{},createdAt:ev.createdAt||Date.now(),updatedAt:Date.now()});
      else await S.db.collection("events").add({...data,done:false,doneDates:{},createdAt:Date.now(),updatedAt:Date.now()});
    });
    if(ok){closeSheet();toast(isEdit?"Saved":"Added to the planner");}
  };
  const del=root.querySelector("#delBtn");
  if(del){let armed=false;del.onclick=async()=>{if(!armed){armed=true;del.textContent="Tap again to delete";return;}const ok=await write(()=>S.db.doc("events/"+ev.id).delete());if(ok){closeSheet();toast("Deleted");}};}
  setTimeout(()=>root.querySelector("#fTitle").focus(),60);
}
const closeSheet=()=>document.getElementById("sheetRoot").innerHTML="";

function gcalUrl(ev){
  const enc=encodeURIComponent;
  const kids=(ev.kidIds||[]).map(id=>kidById(id)?.name).filter(Boolean).join(", ");
  const d=(ev.date||today()).replace(/-/g,"");
  let dates;
  if(ev.time){const end=ev.endTime||addMinutes(ev.time,60);dates=`${d}T${ev.time.replace(":","")}00/${d}T${end.replace(":","")}00`;}
  else{dates=`${d}/${ymd(addDays(parse(ev.date||today()),1)).replace(/-/g,"")}`;}
  const details=[kids?`For: ${kids}`:"",ev.who?`Handled by: ${parentName(ev.who)}`:"",ev.notes||""].filter(Boolean).join("\n");
  let u=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${enc(ev.title||"")}&dates=${dates}&ctz=Africa/Johannesburg&details=${enc(details)}&location=${enc(ev.location||"")}`;
  if(ev.repeat==="weekly")u+=`&recur=${enc("RRULE:FREQ=WEEKLY"+(ev.until?";UNTIL="+ev.until.replace(/-/g,"")+"T215959Z":""))}`;
  return u;
}

/* ---------- PDF ---------- */
const escPdf=s=>String(s).replace(/[^\x20-\x7E]/g,"").replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
function makePdf(lines){
  const pages=[];let cur=[],y=790;
  for(const l of lines){if(y-l.gap<50){pages.push(cur);cur=[];y=790;}cur.push({...l,y});y-=l.gap;}
  if(cur.length)pages.push(cur);
  const n=pages.length,objs=[],pageIds=pages.map((_,i)=>5+2*i),contentIds=pages.map((_,i)=>6+2*i);
  objs[1]="<< /Type /Catalog /Pages 2 0 R >>";
  objs[2]=`<< /Type /Pages /Kids [${pageIds.map(id=>`${id} 0 R`).join(" ")}] /Count ${n} >>`;
  objs[3]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>";
  objs[4]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>";
  pages.forEach((pl,i)=>{
    let st="BT\n";for(const l of pl)st+=`/F${l.bold?2:1} ${l.size} Tf 1 0 0 1 ${l.x||50} ${l.y} Tm (${escPdf(l.t)}) Tj\n`;st+="ET";
    objs[pageIds[i]]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${contentIds[i]} 0 R >>`;
    objs[contentIds[i]]={stream:st};
  });
  let pdf="%PDF-1.4\n";const off=[],maxId=4+2*n;
  for(let id=1;id<=maxId;id++){off[id]=pdf.length;const o=objs[id];pdf+=typeof o==="string"?`${id} 0 obj\n${o}\nendobj\n`:`${id} 0 obj\n<< /Length ${o.stream.length} >>\nstream\n${o.stream}\nendstream\nendobj\n`;}
  const xref=pdf.length;
  pdf+=`xref\n0 ${maxId+1}\n0000000000 65535 f \n`;
  for(let id=1;id<=maxId;id++)pdf+=String(off[id]).padStart(10,"0")+" 00000 n \n";
  pdf+=`trailer\n<< /Size ${maxId+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new Blob([pdf],{type:"application/pdf"});
}
async function downloadWeekPdf(){
  if(!S.downloads){toast("Downloads aren’t available here");return;}
  const m=weekStart(),s=addDays(m,6),lines=[];
  lines.push({t:"Khan Family Planner",size:20,bold:true,gap:24});
  lines.push({t:`Week of ${fmtShort(m)} - ${fmtShort(s)} ${s.getFullYear()}`,size:11,gap:26});
  for(let i=0;i<7;i++){
    const d=addDays(m,i),ds=ymd(d),evs=eventsOn(ds,"all");
    lines.push({t:fmtLong(d).toUpperCase(),size:12,bold:true,gap:17});
    if(!evs.length)lines.push({t:"-",size:10,gap:15,x:64});
    for(const e of evs){
      const kids=(e.kidIds||[]).map(id=>kidById(id)?.name).filter(Boolean).join(", ");
      const t=e.time?`${e.time}${e.endTime?"-"+e.endTime:""}`:"all day";
      const extra=[CATS[e.category]?.label,e.who?parentName(e.who):"",e.location].filter(Boolean).join(" | ");
      lines.push({t:`${t.padEnd(12)}${e.title}  (${kids})`,size:10,gap:14,x:64});
      if(extra)lines.push({t:extra,size:9,gap:13,x:128});
    }
    lines.push({t:"",size:8,gap:8});
  }
  try{await S.downloads.save({filename:`family-week-${ymd(m)}.pdf`,data:makePdf(lines)});toast("PDF saved");}
  catch(e){if(e&&e.code!=="declined")toast("Couldn’t save the PDF");}
}

/* ---------- live tick ---------- */
const notified=new Set();
function tick(){
  const now=new Date(),ds=ymd(now),mm=`${now.getHours()}:${now.getMinutes()}`;
  for(const e of S.events){
    if(!e.remind||!e.time||!occursOn(e,ds)||isDone(e,ds))continue;
    const[h,m]=e.time.split(":").map(Number),at=new Date(now);at.setHours(h,m,0,0);
    const diff=at-now,key=e.id+ds;
    if(diff>0&&diff<=900000&&!notified.has(key)){
      notified.add(key);
      try{if(typeof Notification!=="undefined"&&Notification.permission==="granted")new Notification("Family Planner",{body:`${e.title} at ${e.time}`});}catch(x){}
    }
  }
  renderNextUp();
  if(mm!==lastMinute){lastMinute=mm;if(S.view==="week")renderWeek();}
}
setInterval(tick,30000);

/* ---------- interaction ---------- */
document.getElementById("prevWeek").onclick=()=>{S.weekOffset--;render();};
document.getElementById("nextWeek").onclick=()=>{S.weekOffset++;render();};
document.getElementById("kidFilter").onclick=e=>{const b=e.target.closest("[data-kid]");if(!b)return;S.filter=b.dataset.kid;try{localStorage.setItem("fp-filter",S.filter);}catch(x){}render();};
document.getElementById("strip").onclick=e=>{
  const b=e.target.closest("[data-goto]");if(!b)return;
  const el=document.getElementById("day-"+b.dataset.goto);
  if(el)el.scrollIntoView({behavior:"smooth",block:"start"});
};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  S.view=t.dataset.view;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));
  document.querySelectorAll(".view").forEach(v=>v.hidden=v.id!=="view-"+S.view);
  document.getElementById("fab").hidden=S.view==="settings"||!S.canWrite;
  window.scrollTo({top:0,behavior:"smooth"});
  render();
});
document.getElementById("fab").onclick=()=>{
  if(!S.kids.length){toast("Add a child first");return;}
  openSheet(null,S.weekOffset===0?today():ymd(weekStart()));
};
async function addKidNamed(name){
  name=(name||"").trim();if(!name)return;
  const ok=await write(()=>S.db.collection("kids").add({name,color:KID_COLORS[S.kids.length%KID_COLORS.length],order:S.kids.length,createdAt:Date.now()}));
  if(ok)toast(`${name} added`);
}
async function saveSettings(patch){
  const cur=S.settings||{emails:[],parents:{dad:"Dad",mum:"Mum"}};
  const next={...cur,...patch,updatedAt:Date.now()};
  const ok=await write(()=>S.db.doc("settings/main").set(next));
  if(ok){S.settings=next;renderSettings();toast("Saved");}
}
const mainEl=document.querySelector("main");
mainEl.addEventListener("click",async e=>{
  const chk=e.target.closest("[data-check]");
  if(chk){e.stopPropagation();const ev=S.events.find(x=>x.id===chk.dataset.check);if(!ev)return;const ds=chk.dataset.date;
    await write(()=>ev.repeat==="weekly"?S.db.doc("events/"+ev.id).update({doneDates:{...(ev.doneDates||{}),[ds]:!isDone(ev,ds)}}):S.db.doc("events/"+ev.id).update({done:!ev.done}));return;}
  const row=e.target.closest("[data-ev]");
  if(row){const ev=S.events.find(x=>x.id===row.dataset.ev);if(ev&&S.canWrite)openSheet(ev,row.dataset.date);return;}
  const add=e.target.closest("[data-add]");
  if(add){if(!S.kids.length){toast("Add a child first");return;}openSheet(null,add.dataset.add);return;}
  if(e.target.id==="setupAdd"){await addKidNamed(document.getElementById("setupKid").value);return;}
  if(e.target.id==="addKid"){await addKidNamed(document.getElementById("newKid").value);return;}
  const dk=e.target.closest("[data-delkid]");
  if(dk){const id=dk.dataset.delkid;
    if(armedDelete!=="kid:"+id){armedDelete="kid:"+id;renderSettings();return;}
    armedDelete=null;
    const ok=await write(async()=>{
      await S.db.doc("kids/"+id).delete();
      for(const ev of S.events.filter(x=>(x.kidIds||[]).includes(id))){
        const rest=ev.kidIds.filter(k=>k!==id);
        if(rest.length)await S.db.doc("events/"+ev.id).update({kidIds:rest});
        else await S.db.doc("events/"+ev.id).delete();
      }
    });
    if(ok)toast("Removed");return;}
  if(e.target.id==="addEmail"){
    const v=document.getElementById("newEmail").value.trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){toast("That doesn’t look like an email address");return;}
    await saveSettings({emails:[...new Set([...(S.settings?.emails||[]),v])]});return;}
  const de=e.target.closest("[data-delemail]");
  if(de){const arr=[...(S.settings?.emails||[])];arr.splice(Number(de.dataset.delemail),1);await saveSettings({emails:arr});return;}
  if(e.target.id==="pdfBtn"){downloadWeekPdf();return;}
  if(e.target.id==="installBtn"&&S.installEvt){S.installEvt.prompt();const r=await S.installEvt.userChoice.catch(()=>null);if(r&&r.outcome==="accepted"){S.installEvt=null;renderSettings();}return;}
  if(e.target.id==="signOutBtn"){if(e.target.dataset.arm!=="1"){e.target.dataset.arm="1";e.target.textContent="Tap again";return;}await KFP.auth.signOut();location.reload();return;}
});
mainEl.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  if(e.target.id==="setupKid"||e.target.id==="newKid"){e.preventDefault();addKidNamed(e.target.value);}
  if(e.target.id==="newEmail"){e.preventDefault();document.getElementById("addEmail").click();}
  if(e.target.matches("[data-ev]")){e.preventDefault();e.target.click();}
});
mainEl.addEventListener("change",async e=>{
  if(e.target.id==="pDad"||e.target.id==="pMum")
    await saveSettings({parents:{dad:document.getElementById("pDad").value.trim()||"Dad",mum:document.getElementById("pMum").value.trim()||"Mum"}});
});
/* swipe between weeks */
let sx=0,sy=0;
mainEl.addEventListener("touchstart",e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY;},{passive:true});
mainEl.addEventListener("touchend",e=>{
  if(S.view!=="week")return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2){S.weekOffset+=dx<0?1:-1;render();}
},{passive:true});

/* ---------- boot ---------- */
try{const f=localStorage.getItem("fp-filter");if(f)S.filter=f;}catch(x){}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();S.installEvt=e;if(S.view==="settings")renderSettings();});
window.addEventListener("appinstalled",()=>{S.installEvt=null;toast("Installed — find it on your home screen");});
if("serviceWorker" in navigator&&location.protocol!=="file:")window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
(async function boot(){
  const login=document.getElementById("login"),form=document.getElementById("loginForm"),err=document.getElementById("lgErr"),btn=document.getElementById("lgBtn");
  const enter=session=>{S.user=session&&session.user&&session.user.email||S.user;login.hidden=true;if(!S.db)connect();render();};
  let session=null;try{session=await KFP.auth.session();}catch(x){}
  if(session){enter(session);return;}
  setStatus(false,"Signed out");login.hidden=false;
  setTimeout(()=>document.getElementById("lgEmail").focus(),50);
  form.addEventListener("submit",async ev=>{
    ev.preventDefault();err.textContent="";
    const email=document.getElementById("lgEmail").value.trim().toLowerCase(),pass=document.getElementById("lgPass").value;
    if(!ALLOWED.includes(email)){err.textContent="This planner is only for the Khan family.";return;}
    btn.disabled=true;btn.textContent="Signing in…";
    try{const s=await KFP.auth.signIn(email,pass);enter(s);}
    catch(e){err.textContent=/invalid/i.test(e&&e.message||"")?"Email or password is wrong.":(navigator.onLine?"Couldn’t sign in — try again.":"You’re offline — connect to sign in the first time.");}
    finally{btn.disabled=false;btn.textContent="Sign in";}
  });
})();
</script>
